<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 단어장 & 단어 시험</title>
  <!-- 엑셀 파일(.xlsx)을 읽기 위한 SheetJS 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      width: 100%;
      max-width: 600px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }
    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background-color: #e0e0e0;
      color: #555;
      transition: 0.3s;
    }
    .nav-buttons button.active {
      background-color: #3498db;
      color: white;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      position: relative;
    }
    .input-wrapper {
      flex: 1;
      position: relative;
    }
    .input-wrapper input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .recommend-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #3498db;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      max-height: 180px;
      overflow-y: auto;
      z-index: 100;
      list-style: none;
      display: none;
      margin-top: 4px;
    }
    .recommend-box li {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      border-bottom: 1px solid #eee;
    }
    .recommend-box li:last-child {
      border-bottom: none;
    }
    .recommend-box li:hover {
      background-color: #ebf5fb;
      color: #2980b9;
      font-weight: bold;
    }

    .btn-group-form {
      display: flex;
      gap: 8px;
    }
    .btn-submit-form {
      flex: 1;
      padding: 12px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit-form:hover {
      background-color: #27ae60;
    }
    .btn-cancel-edit {
      padding: 12px;
      background-color: #95a5a6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }
    .btn-cancel-edit:hover {
      background-color: #7f8c8d;
    }

    .word-list {
      list-style: none;
      margin-top: 20px;
      max-height: 380px;
      overflow-y: auto;
    }
    .word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f9f9f9;
      border-bottom: 1px solid #eee;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .word-info {
      font-size: 15px;
    }
    .word-info .eng {
      font-weight: bold;
      color: #2c3e50;
      margin-right: 8px;
    }
    .word-info .kor {
      color: #7f8c8d;
    }
    .stats-tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      color: #2980b9;
      background-color: #ebf5fb;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }
    .action-buttons {
      display: flex;
      gap: 5px;
    }
    .btn-edit {
      background-color: #f39c12;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-edit:hover {
      background-color: #d68910;
    }
    .btn-delete {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-delete:hover {
      background-color: #c0392b;
    }

    .test-box {
      text-align: center;
      padding: 20px 0;
    }
    .quiz-card {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 30px;
      margin-bottom: 20px;
    }
    .quiz-word {
      font-size: 32px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 15px;
    }
    .test-input {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 15px;
    }
    .btn-submit {
      padding: 10px 25px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .result-message {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }
    .correct { color: #2ecc71; }
    .wrong { color: #e74c3c; }
  </style>
</head>
<body>

<div class="container">
  <h1>나만의 단어장</h1>

  <div class="nav-buttons">
    <button id="tab-manage-btn" class="active" onclick="switchTab('manage')">단어 관리</button>
    <button id="tab-test-btn" onclick="switchTab('test')">시험 보기</button>
  </div>

  <div id="tab-manage" class="tab-content active">
    <form id="word-form" onsubmit="handleFormSubmit(event)">
      <div class="input-group">
        <div class="input-wrapper">
          <input type="text" id="eng-input" placeholder="영어 단어 (예: accumulate)" required autocomplete="off" oninput="searchDictMeaning(this.value)">
        </div>
        <div class="input-wrapper">
          <input type="text" id="kor-input" placeholder="한글 뜻 (사과, 모으다 등)" required autocomplete="off">
          <ul id="recommend-box" class="recommend-box"></ul>
        </div>
      </div>
      <div class="btn-group-form">
        <button type="submit" id="btn-submit-form" class="btn-submit-form">단어 추가하기</button>
        <button type="button" id="btn-cancel-edit" class="btn-cancel-edit" onclick="cancelEdit()">취소</button>
      </div>
    </form>

    <ul id="word-list" class="word-list"></ul>
  </div>

  <div id="tab-test" class="tab-content">
    <div id="test-container" class="test-box"></div>
  </div>
</div>

<script>
  // 엑셀에서 로드될 사전 데이터 변수
  let dictionaryData = [];

  let words = (JSON.parse(localStorage.getItem('myWords')) || []).map(item => ({
    ...item,
    testedCount: item.testedCount || 0,
    correctCount: item.correctCount || 0
  }));
  
  let editingId = null;
  let currentQuizList = [];
  let currentQuizIndex = 0;

  window.addEventListener('DOMContentLoaded', () => {
    loadExcelData();
    renderWordList();
  });

  // words.xlsx 파일 읽어오기
  async function loadExcelData() {
    try {
      const response = await fetch('words.xlsx');
      const arrayBuffer = await response.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: 'array' });
      
      // 첫 번째 시트 가져오기
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      
      // 시트 데이터를 JSON 배열로 변환
      const rawData = XLSX.utils.sheet_to_json(worksheet);
      
      // 기존 구조에 맞게 변환 (kor 뜻을 쉼표 단위로 배열화)
      dictionaryData = rawData.map(row => {
        const korStr = String(row.kor || '');
        const korArray = korStr.split(',').map(s => s.trim()).filter(Boolean);
        return {
          eng: String(row.eng || '').trim(),
          kor: korArray
        };
      });
      console.log('엑셀 단어 로드 완료:', dictionaryData.length, '개');
    } catch (err) {
      console.error('words.xlsx 파일을 불러오지 못했습니다. 파일 위치나 오타를 확인하세요.', err);
    }
  }

  document.addEventListener('click', function(e) {
    const recommendBox = document.getElementById('recommend-box');
    const korInput = document.getElementById('kor-input');
    if (e.target !== recommendBox && e.target !== korInput) {
      recommendBox.style.display = 'none';
    }
  });

  function searchDictMeaning(englishWord) {
    const recommendBox = document.getElementById('recommend-box');
    recommendBox.innerHTML = '';

    const query = englishWord.trim().toLowerCase();
    if (!query) {
      recommendBox.style.display = 'none';
      return;
    }

    const matched = dictionaryData.find(item => item.eng.toLowerCase() === query);

    if (matched && matched.kor && matched.kor.length > 0) {
      matched.kor.forEach(meaning => {
        const li = document.createElement('li');
        li.textContent = meaning;
        li.onclick = function() {
          document.getElementById('kor-input').value = meaning;
          recommendBox.style.display = 'none';
        };
        recommendBox.appendChild(li);
      });
      recommendBox.style.display = 'block';
    } else {
      recommendBox.style.display = 'none';
    }
  }

  function switchTab(tabName) {
    document.getElementById('tab-manage').classList.remove('active');
    document.getElementById('tab-test').classList.remove('active');
    document.getElementById('tab-manage-btn').classList.remove('active');
    document.getElementById('tab-test-btn').classList.remove('active');

    if (tabName === 'manage') {
      document.getElementById('tab-manage').classList.add('active');
      document.getElementById('tab-manage-btn').classList.add('active');
      renderWordList();
    } else if (tabName === 'test') {
      document.getElementById('tab-test').classList.add('active');
      document.getElementById('tab-test-btn').classList.add('active');
      startTest();
    }
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    
    const engInput = document.getElementById('eng-input');
    const korInput = document.getElementById('kor-input');
    
    const english = engInput.value.trim();
    const korean = korInput.value.trim();

    document.getElementById('recommend-box').style.display = 'none';

    if (editingId !== null) {
      const isDuplicate = words.some(item => item.id !== editingId && item.english.toLowerCase() === english.toLowerCase());
      if (isDuplicate) {
        alert('이미 존재하는 다른 단어입니다.');
        engInput.focus();
        return;
      }

      words = words.map(item => {
        if (item.id === editingId) {
          return { ...item, english: english, korean: korean };
        }
        return item;
      });

      cancelEdit();
    } else {
      const isDuplicate = words.some(item => item.english.toLowerCase() === english.toLowerCase());
      if (isDuplicate) {
        alert('이미 추가된 단어입니다.');
        engInput.focus();
        return;
      }

      words.unshift({
        id: Date.now(),
        english: english,
        korean: korean,
        testedCount: 0,
        correctCount: 0
      });

      engInput.value = '';
      korInput.value = '';
      engInput.focus();
    }

    saveWords();
    renderWordList();
  }

  function startEdit(id) {
    const wordToEdit = words.find(item => item.id === id);
    if (!wordToEdit) return;

    editingId = id;
    
    document.getElementById('eng-input').value = wordToEdit.english;
    document.getElementById('kor-input').value = wordToEdit.korean;
    
    document.getElementById('btn-submit-form').textContent = '단어 수정 완료';
    document.getElementById('btn-submit-form').style.backgroundColor = '#f39c12';
    document.getElementById('btn-cancel-edit').style.display = 'block';

    document.getElementById('eng-input').focus();
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById('eng-input').value = '';
    document.getElementById('kor-input').value = '';
    document.getElementById('recommend-box').style.display = 'none';
    
    document.getElementById('btn-submit-form').textContent = '단어 추가하기';
    document.getElementById('btn-submit-form').style.backgroundColor = '#2ecc71';
    document.getElementById('btn-cancel-edit').style.display = 'none';
  }

  function deleteWord(id) {
    if (editingId === id) {
      cancelEdit();
    }
    words = words.filter(item => item.id !== id);
    saveWords();
    renderWordList();
  }

  function saveWords() {
    localStorage.setItem('myWords', JSON.stringify(words));
  }

  function renderWordList() {
    const listElement = document.getElementById('word-list');
    listElement.innerHTML = '';

    if (words.length === 0) {
      listElement.innerHTML = '<li style="text-align:center; color:#999; padding:20px;">저장된 단어가 없습니다. 단어를 추가해보세요!</li>';
      return;
    }

    words.forEach(item => {
      const tested = item.testedCount || 0;
      const correct = item.correctCount || 0;
      const rate = tested > 0 ? Math.round((correct / tested) * 100) : 0;
      
      const statsText = tested === 0 
        ? '시도 안 함' 
        : `정답률 ${rate}% (${correct}/${tested}회 맞힘)`;

      const li = document.createElement('li');
      li.className = 'word-item';
      li.innerHTML = `
        <div class="word-info">
          <div>
            <span class="eng">${escapeHtml(item.english)}</span>
            <span class="kor">${escapeHtml(item.korean)}</span>
          </div>
          <span class="stats-tag">📊 ${statsText}</span>
        </div>
        <div class="action-buttons">
          <button class="btn-edit" onclick="startEdit(${item.id})">수정</button>
          <button class="btn-delete" onclick="deleteWord(${item.id})">삭제</button>
        </div>
      `;
      listElement.appendChild(li);
    });
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function startTest() {
    const container = document.getElementById('test-container');
    
    if (words.length === 0) {
      container.innerHTML = '<p style="color:#666;">시험을 볼 단어가 없습니다. 먼저 단어를 추가해주세요!</p>';
      return;
    }

    currentQuizList = [...words].sort(() => Math.random() - 0.5);
    currentQuizIndex = 0;

    showNextQuestion();
  }

  function showNextQuestion() {
    const container = document.getElementById('test-container');

    if (currentQuizIndex >= currentQuizList.length) {
      container.innerHTML = `
        <div class="quiz-card">
          <h2>🎉 모든 시험을 완료했습니다!</h2>
          <p style="margin-top:15px; color:#666;">총 ${currentQuizList.length}개 단어 테스트 완료</p>
          <button class="btn-submit" style="margin-top:20px;" onclick="startTest()">다시 시험보기</button>
        </div>
      `;
      return;
    }

    const currentWord = currentQuizList[currentQuizIndex];

    container.innerHTML = `
      <p style="margin-bottom:10px; color:#888;">문제 ${currentQuizIndex + 1} / ${currentQuizList.length}</p>
      <div class="quiz-card">
        <div class="quiz-word">${escapeHtml(currentWord.english)}</div>
        <form onsubmit="checkAnswer(event, ${currentWord.id}, '${escapeHtml(currentWord.korean)}')">
          <input type="text" id="answer-input" class="test-input" placeholder="한글 뜻을 입력하세요" required autocomplete="off" autofocus>
          <br>
          <button type="submit" class="btn-submit">확인</button>
        </form>
        <div id="result-msg" class="result-message"></div>
      </div>
    `;
    
    document.getElementById('answer-input').focus();
  }

  function checkAnswer(e, wordId, correctAnswer) {
    e.preventDefault();
    const inputElement = document.getElementById('answer-input');
    const resultMsg = document.getElementById('result-msg');
    const userAnswer = inputElement.value.trim();

    const isCorrect = (userAnswer === correctAnswer);

    words = words.map(item => {
      if (item.id === wordId) {
        return {
          ...item,
          testedCount: (item.testedCount || 0) + 1,
          correctCount: (item.correctCount || 0) + (isCorrect ? 1 : 0)
        };
      }
      return item;
    });

    saveWords();

    if (isCorrect) {
      resultMsg.className = 'result-message correct';
      resultMsg.textContent = '⭕ 정답입니다!';
      setTimeout(() => {
        currentQuizIndex++;
        showNextQuestion();
      }, 1000);
    } else {
      resultMsg.className = 'result-message wrong';
      resultMsg.textContent = `❌ 틀렸습니다. (정답: ${correctAnswer})`;
      setTimeout(() => {
        currentQuizIndex++;
        showNextQuestion();
      }, 2000);
    }
  }
</script>

</body>
</html>
