<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 단어장 & 단어 시험</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      width: 100%;
      max-width: 600px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }
    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background-color: #e0e0e0;
      color: #555;
      transition: 0.3s;
    }
    .nav-buttons button.active {
      background-color: #3498db;
      color: white;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    
    /* 단어 추가/수정 Form */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .input-group input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .btn-group-form {
      display: flex;
      gap: 8px;
    }
    .btn-submit-form {
      flex: 1;
      padding: 12px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit-form:hover {
      background-color: #27ae60;
    }
    .btn-cancel-edit {
      padding: 12px;
      background-color: #95a5a6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: none; /* 기본 숨김 */
    }
    .btn-cancel-edit:hover {
      background-color: #7f8c8d;
    }

    /* 단어 목록 */
    .word-list {
      list-style: none;
      margin-top: 20px;
      max-height: 350px;
      overflow-y: auto;
    }
    .word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f9f9f9;
      border-bottom: 1px solid #eee;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .word-info {
      font-size: 15px;
    }
    .word-info .eng {
      font-weight: bold;
      color: #2c3e50;
      margin-right: 8px;
    }
    .word-info .kor {
      color: #7f8c8d;
    }
    .action-buttons {
      display: flex;
      gap: 5px;
    }
    .btn-edit {
      background-color: #f39c12;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-edit:hover {
      background-color: #d68910;
    }
    .btn-delete {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-delete:hover {
      background-color: #c0392b;
    }

    /* 시험 화면 */
    .test-box {
      text-align: center;
      padding: 20px 0;
    }
    .quiz-card {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 30px;
      margin-bottom: 20px;
    }
    .quiz-word {
      font-size: 32px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 15px;
    }
    .test-input {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 15px;
    }
    .btn-submit {
      padding: 10px 25px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .result-message {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }
    .correct { color: #2ecc71; }
    .wrong { color: #e74c3c; }
  </style>
</head>
<body>

<div class="container">
  <h1>나만의 단어장</h1>

  <!-- 탭 버튼 -->
  <div class="nav-buttons">
    <button id="tab-manage-btn" class="active" onclick="switchTab('manage')">단어 관리</button>
    <button id="tab-test-btn" onclick="switchTab('test')">시험 보기</button>
  </div>

  <!-- 1. 단어 관리 탭 -->
  <div id="tab-manage" class="tab-content active">
    <form id="word-form" onsubmit="handleFormSubmit(event)">
      <div class="input-group">
        <input type="text" id="eng-input" placeholder="영어 단어 (예: apple)" required autocomplete="off">
        <input type="text" id="kor-input" placeholder="한글 뜻 (예: 사과)" required autocomplete="off">
      </div>
      <div class="btn-group-form">
        <button type="submit" id="btn-submit-form" class="btn-submit-form">단어 추가하기</button>
        <button type="button" id="btn-cancel-edit" class="btn-cancel-edit" onclick="cancelEdit()">취소</button>
      </div>
    </form>

    <ul id="word-list" class="word-list">
      <!-- 저장된 단어들이 여기에 표시됩니다 -->
    </ul>
  </div>

  <!-- 2. 시험 보기 탭 -->
  <div id="tab-test" class="tab-content">
    <div id="test-container" class="test-box">
      <!-- 시험 내용이 JavaScript로 들어갑니다 -->
    </div>
  </div>
</div>

<script>
  // 로컬스토리지에서 단어 불러오기
  let words = JSON.parse(localStorage.getItem('myWords')) || [];
  
  // 수정 모드 상태 (null이면 추가 모드, id값이 있으면 수정 모드)
  let editingId = null;

  // 시험 진행용 변수
  let currentQuizList = [];
  let currentQuizIndex = 0;

  // 초기 단어 목록 출력
  renderWordList();

  // 탭 전환 함수
  function switchTab(tabName) {
    document.getElementById('tab-manage').classList.remove('active');
    document.getElementById('tab-test').classList.remove('active');
    document.getElementById('tab-manage-btn').classList.remove('active');
    document.getElementById('tab-test-btn').classList.remove('active');

    if (tabName === 'manage') {
      document.getElementById('tab-manage').classList.add('active');
      document.getElementById('tab-manage-btn').classList.add('active');
      renderWordList();
    } else if (tabName === 'test') {
      document.getElementById('tab-test').classList.add('active');
      document.getElementById('tab-test-btn').classList.add('active');
      startTest();
    }
  }

  // 폼 제출 처리 (추가 또는 수정)
  function handleFormSubmit(e) {
    e.preventDefault();
    
    const engInput = document.getElementById('eng-input');
    const korInput = document.getElementById('kor-input');
    
    const english = engInput.value.trim();
    const korean = korInput.value.trim();

    if (editingId !== null) {
      // 1. 단어 수정 모드
      // 자기 자신을 제외한 다른 단어 중 중복이 있는지 확인
      const isDuplicate = words.some(item => item.id !== editingId && item.english.toLowerCase() === english.toLowerCase());
      if (isDuplicate) {
        alert('이미 존재하는 다른 단어입니다.');
        engInput.focus();
        return;
      }

      // 단어 정보 업데이트
      words = words.map(item => {
        if (item.id === editingId) {
          return { ...item, english: english, korean: korean };
        }
        return item;
      });

      cancelEdit(); // 수정 모드 종료 및 폼 초기화
    } else {
      // 2. 단어 추가 모드
      const isDuplicate = words.some(item => item.english.toLowerCase() === english.toLowerCase());
      if (isDuplicate) {
        alert('이미 추가된 단어입니다.');
        engInput.focus();
        return;
      }

      words.unshift({
        id: Date.now(),
        english: english,
        korean: korean
      });

      // 입력창 초기화
      engInput.value = '';
      korInput.value = '';
      engInput.focus();
    }

    saveWords();
    renderWordList();
  }

  // 수정 버튼 클릭 시 실행되는 함수
  function startEdit(id) {
    const wordToEdit = words.find(item => item.id === id);
    if (!wordToEdit) return;

    editingId = id;
    
    // 입력 칸에 기존 값 채우기
    document.getElementById('eng-input').value = wordToEdit.english;
    document.getElementById('kor-input').value = wordToEdit.korean;
    
    // 버튼 텍스트 변경 및 취소 버튼 표시
    document.getElementById('btn-submit-form').textContent = '단어 수정 완료';
    document.getElementById('btn-submit-form').style.backgroundColor = '#f39c12';
    document.getElementById('btn-cancel-edit').style.display = 'block';

    document.getElementById('eng-input').focus();
  }

  // 수정 취소 함수
  function cancelEdit() {
    editingId = null;
    document.getElementById('eng-input').value = '';
    document.getElementById('kor-input').value = '';
    
    document.getElementById('btn-submit-form').textContent = '단어 추가하기';
    document.getElementById('btn-submit-form').style.backgroundColor = '#2ecc71';
    document.getElementById('btn-cancel-edit').style.display = 'none';
  }

  // 단어 삭제 함수
  function deleteWord(id) {
    if (editingId === id) {
      cancelEdit(); // 수정 중에 삭제할 경우 수정 취소
    }
    words = words.filter(item => item.id !== id);
    saveWords();
    renderWordList();
  }

  // 로컬스토리지 저장 함수
  function saveWords() {
    localStorage.setItem('myWords', JSON.stringify(words));
  }

  // 단어 목록 화면에 출력
  function renderWordList() {
    const listElement = document.getElementById('word-list');
    listElement.innerHTML = '';

    if (words.length === 0) {
      listElement.innerHTML = '<li style="text-align:center; color:#999; padding:20px;">저장된 단어가 없습니다. 단어를 추가해보세요!</li>';
      return;
    }

    words.forEach(item => {
      const li = document.createElement('li');
      li.className = 'word-item';
      li.innerHTML = `
        <div class="word-info">
          <span class="eng">${escapeHtml(item.english)}</span>
          <span class="kor">${escapeHtml(item.korean)}</span>
        </div>
        <div class="action-buttons">
          <button class="btn-edit" onclick="startEdit(${item.id})">수정</button>
          <button class="btn-delete" onclick="deleteWord(${item.id})">삭제</button>
        </div>
      `;
      listElement.appendChild(li);
    });
  }

  // HTML 태그 입력 방지 (보안용)
  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // 시험 시작 준비 (단어 랜덤 섞기)
  function startTest() {
    const container = document.getElementById('test-container');
    
    if (words.length === 0) {
      container.innerHTML = '<p style="color:#666;">시험을 볼 단어가 없습니다. 먼저 단어를 추가해주세요!</p>';
      return;
    }

    currentQuizList = [...words].sort(() => Math.random() - 0.5);
    currentQuizIndex = 0;

    showNextQuestion();
  }

  // 문제 표시 함수
  function showNextQuestion() {
    const container = document.getElementById('test-container');

    if (currentQuizIndex >= currentQuizList.length) {
      container.innerHTML = `
        <div class="quiz-card">
          <h2>🎉 모든 시험을 완료했습니다!</h2>
          <p style="margin-top:15px; color:#666;">총 ${currentQuizList.length}개 단어 테스트 완료</p>
          <button class="btn-submit" style="margin-top:20px;" onclick="startTest()">다시 시험보기</button>
        </div>
      `;
      return;
    }

    const currentWord = currentQuizList[currentQuizIndex];

    container.innerHTML = `
      <p style="margin-bottom:10px; color:#888;">문제 ${currentQuizIndex + 1} / ${currentQuizList.length}</p>
      <div class="quiz-card">
        <div class="quiz-word">${escapeHtml(currentWord.english)}</div>
        <form onsubmit="checkAnswer(event, '${escapeHtml(currentWord.korean)}')">
          <input type="text" id="answer-input" class="test-input" placeholder="한글 뜻을 입력하세요" required autocomplete="off" autofocus>
          <br>
          <button type="submit" class="btn-submit">확인</button>
        </form>
        <div id="result-msg" class="result-message"></div>
      </div>
    `;
    
    document.getElementById('answer-input').focus();
  }

  // 정답 확인 함수
  function checkAnswer(e, correctAnswer) {
    e.preventDefault();
    const inputElement = document.getElementById('answer-input');
    const resultMsg = document.getElementById('result-msg');
    const userAnswer = inputElement.value.trim();

    if (userAnswer === correctAnswer) {
      resultMsg.className = 'result-message correct';
      resultMsg.textContent = '⭕ 정답입니다!';
      setTimeout(() => {
        currentQuizIndex++;
        showNextQuestion();
      }, 1000);
    } else {
      resultMsg.className = 'result-message wrong';
      resultMsg.textContent = `❌ 틀렸습니다. (정답: ${correctAnswer})`;
      setTimeout(() => {
        currentQuizIndex++;
        showNextQuestion();
      }, 2000);
    }
  }
</script>

</body>
</html>
